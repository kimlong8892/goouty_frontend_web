<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Goouty - Lên kế hoạch chuyến đi, chia tiền nhóm, không rắc rối</title>
  <meta name="description"
    content="Goouty - Ứng dụng lập kế hoạch chuyến đi và quản lý chi phí nhóm. Plan trips, split expenses, no hassle." />
  <meta name="author" content="Goouty Team" />
  <meta name="keywords"
    content="chuyến đi, du lịch, chia tiền, chi phí, nhóm, travel, trip planning, expense splitting" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap"
    rel="stylesheet">

  <!-- PWA Manifest will be injected by VitePWA, but added here for reliability -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#edeeff" />

  <!-- Icons -->
  <link rel="icon" href="/favicon_v2.png" type="image/png" />
  <link rel="shortcut icon" href="/favicon_v2.png" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon_v2.png" />
  <link rel="mask-icon" href="/goouty-logo.svg" color="#edeeff" />

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Goouty" />

  <!-- Open Graph -->
  <meta property="og:image" content="/favicon_v2.png" />
  <meta property="og:title" content="Goouty - Lên kế hoạch chuyến đi" />
  <meta property="og:description" content="Ứng dụng lập kế hoạch chuyến đi và quản lý chi phí nhóm" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Goouty - Lên kế hoạch chuyến đi" />
  <meta name="twitter:description" content="Ứng dụng lập kế hoạch chuyến đi và quản lý chi phí nhóm" />
  <meta name="twitter:image" content="/favicon_v2.png" />
  <script>
    // Apply theme before React renders to avoid flash
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        // Default to light, only use dark if explicitly stored
        var shouldUseDark = stored === 'dark';
        if (shouldUseDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (_) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

</body>

</html>
