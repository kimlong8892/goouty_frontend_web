version: '3.9'

services:
  vite_app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: vite_react_app_local
    working_dir: /usr/src/app
    ports:
      - "8080:8080"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env.local
    environment:
      - VITE_BASIC_AUTH_USER=goouty
      - VITE_BASIC_AUTH_PASS=minh_long_hoang
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped